<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cahier Commun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F5EF;
    --surface:#FFFFFF;
    --surface-2:#EAEEE4;
    --ink:#20261F;
    --ink-muted:#5B6459;
    --border:#D9DECD;
    --accent:#1F4E8C;
    --accent-ink:#0E2D57;
    --accent-soft:#E4ECF7;
    --red:#A6303C;
    --red-soft:#F6E4E4;
    --green:#3D7A4D;
    --green-soft:#E3EFDf;
    --shadow: 0 1px 2px rgba(32,38,31,.06), 0 6px 20px -8px rgba(32,38,31,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12160F; --surface:#191F17; --surface-2:#212820;
      --ink:#E8ECE2; --ink-muted:#98A092; --border:#2B3327;
      --accent:#7CA6E6; --accent-ink:#DCE8FB; --accent-soft:#1E2B41;
      --red:#E28B92; --red-soft:#3A2224; --green:#7FC090; --green-soft:#1E2F22;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px -8px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12160F; --surface:#191F17; --surface-2:#212820;
    --ink:#E8ECE2; --ink-muted:#98A092; --border:#2B3327;
    --accent:#7CA6E6; --accent-ink:#DCE8FB; --accent-soft:#1E2B41;
    --red:#E28B92; --red-soft:#3A2224; --green:#7FC090; --green-soft:#1E2F22;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px -8px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    background:
      repeating-linear-gradient(to bottom, transparent 0 27px, color-mix(in srgb, var(--border) 45%, transparent) 27px 28px),
      var(--paper);
    color:var(--ink);
    font-family:"Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    padding-inline:20px;
    padding-block:28px;
  }
  main{max-width:940px;margin:0 auto;}
  h1,h2,h3{font-family:"Spectral",Georgia,serif;text-wrap:balance;margin:0;}
  a{color:var(--accent);}

  .app-header{margin-bottom:8px;}
  .app-header h1{font-size:1.7rem;font-weight:700;color:var(--accent-ink);}
  .app-header .tag{font-size:.8rem;color:var(--ink-muted);font-family:"JetBrains Mono",monospace;letter-spacing:.02em;margin-top:4px;}

  .board{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media (max-width:820px){.board{grid-template-columns:1fr;}}
  .column{display:flex;flex-direction:column;gap:12px;}
  .column-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:2px solid var(--border);}
  .column-head .badge{
    font-family:"JetBrains Mono",monospace;font-size:.72rem;font-weight:600;letter-spacing:.04em;
    padding:3px 8px;border-radius:5px;border:1px solid var(--accent);color:var(--accent-ink);background:var(--accent-soft);
  }
  .column-count{color:var(--ink-muted);font-size:.78rem;font-family:"JetBrains Mono",monospace;}
  .card-list{display:flex;flex-direction:column;gap:10px;}
  .chapter-card{
    display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;text-decoration:none;color:inherit;box-shadow:var(--shadow);
  }
  .chapter-card:hover{border-color:var(--accent);}
  .chapter-card .title{font-family:"Spectral",serif;font-weight:600;font-size:1rem;line-height:1.3;margin-bottom:6px;}
  .chapter-card .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .pill{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;font-family:"JetBrains Mono",monospace;letter-spacing:.02em;white-space:nowrap;}
  .pill-done{background:var(--green-soft);color:var(--green);border:1px solid color-mix(in srgb, var(--green) 40%, transparent);}
  .date{color:var(--ink-muted);font-size:.76rem;font-family:"JetBrains Mono",monospace;}
  .empty-col{border:1px dashed var(--border);border-radius:10px;padding:16px;color:var(--ink-muted);font-size:.85rem;text-align:center;}

  footer{margin-top:30px;color:var(--ink-muted);font-size:.78rem;text-align:center;}
</style>
</head>
<body>
<main>
  <header class="app-header">
    <h1>Cahier Commun</h1>
    <div class="tag">prépa · maths · physique · si</div>
  </header>

  <div class="board" id="board"></div>

  <footer>Mis à jour au fil des chapitres traités.</footer>
</main>

<script>
(function(){
  "use strict";

  // Ajoute une ligne ici à chaque nouveau chapitre publié.
  var CHAPTERS = [
    { subject: "Mathématiques", title: "Chapitre 1 — Ensembles, logique, méthodes de raisonnement", url: "chapitre-1-ensembles-logique.html", addedAt: "2026-09-20" },
    { subject: "Mathématiques", title: "Chapitre 2 — Calcul algébrique", url: "chapitre-2-calcul-algebrique.html", addedAt: "2026-09-20" },
    { subject: "Mathématiques", title: "Chapitre 3 — Applications", url: "chapitre-3-applications.html", addedAt: "2026-09-20" },
    { subject: "Mathématiques", title: "Chapitre 4 — Systèmes linéaires", url: "chapitre-4-systemes-lineaires.html", addedAt: "2026-09-20" },
    { subject: "Mathématiques", title: "Chapitre 5 — Relations d'ordre, relations d'équivalence", url: "chapitre-5-relations.html", addedAt: "2026-09-20" }
  ];

  var SUBJECTS = [
    {key:"Mathématiques", short:"MATH"},
    {key:"Physique", short:"PHYS"},
    {key:"Sciences de l'Ingénieur", short:"SI"}
  ];

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function formatDate(iso){
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("fr-FR", {day:"numeric", month:"short"});
  }

  function render(){
    var board = document.getElementById("board");
    board.innerHTML = "";
    SUBJECTS.forEach(function(subj){
      var chapters = CHAPTERS.filter(function(c){ return c.subject === subj.key; })
        .sort(function(a,b){ return (a.addedAt||"").localeCompare(b.addedAt||""); });

      var col = document.createElement("div");
      col.className = "column";
      col.innerHTML =
        '<div class="column-head">' +
          '<span class="badge">' + escapeHtml(subj.short) + '</span>' +
          '<span class="column-count">' + chapters.length + ' chapitre' + (chapters.length === 1 ? "" : "s") + '</span>' +
        '</div>';

      var list = document.createElement("div");
      list.className = "card-list";
      if (chapters.length === 0){
        var empty = document.createElement("div");
        empty.className = "empty-col";
        empty.textContent = "Rien pour l'instant";
        list.appendChild(empty);
      } else {
        chapters.forEach(function(c){
          var a = document.createElement("a");
          a.className = "chapter-card";
          a.href = c.url;
          a.innerHTML =
            '<div class="title">' + escapeHtml(c.title) + '</div>' +
            '<div class="meta">' +
              '<span class="pill pill-done">cours rédigé</span>' +
              '<span class="date">' + escapeHtml(formatDate(c.addedAt)) + '</span>' +
            '</div>';
          list.appendChild(a);
        });
      }
      col.appendChild(list);
      board.appendChild(col);
    });
  }

  render();
})();
</script>

</body>
</html>
