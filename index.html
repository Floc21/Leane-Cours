<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Cahier de Léane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F3;
    --surface:#FFFFFF;
    --surface-2:#F1EEE4;
    --ink:#23231F;
    --ink-muted:#6B6A5F;
    --border:#E3DFD1;
    --accent:#1F3A5F;
    --accent-ink:#14263F;
    --accent-soft:#E7EDF5;
    --red:#B23A46;
    --red-soft:#F7E7E7;
    --green:#2F7A4F;
    --green-soft:#E3F1E8;
    --shadow: 0 1px 2px rgba(32,38,31,.06), 0 6px 20px -8px rgba(32,38,31,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14171C; --surface:#1B1F26; --surface-2:#242933;
      --ink:#EDEFF2; --ink-muted:#9AA1AC; --border:#2E3440;
      --accent:#7FA8E8; --accent-ink:#DCE7F9; --accent-soft:#22344B;
      --red:#E28B92; --red-soft:#3A2224; --green:#7FC090; --green-soft:#1E2F22;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px -8px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#14171C; --surface:#1B1F26; --surface-2:#242933;
    --ink:#EDEFF2; --ink-muted:#9AA1AC; --border:#2E3440;
    --accent:#7FA8E8; --accent-ink:#DCE7F9; --accent-soft:#22344B;
    --red:#E28B92; --red-soft:#3A2224; --green:#7FC090; --green-soft:#1E2F22;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px -8px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    background:
      repeating-linear-gradient(to bottom, transparent 0 27px, color-mix(in srgb, var(--border) 45%, transparent) 27px 28px),
      var(--paper);
    color:var(--ink);
    font-family:"Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    padding-inline:20px;
    padding-block:28px;
  }
  main{max-width:720px;margin:0 auto;}
  h1,h2,h3{font-family:"Spectral",Georgia,serif;text-wrap:balance;margin:0;}
  a{color:var(--accent);}

  .pinned-header{
    position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
    margin:-28px -20px 22px -20px;padding:12px 20px 10px;
  }
  .pinned-header-inner{max-width:720px;margin:0 auto;display:flex;align-items:baseline;gap:8px;}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:.62rem;font-weight:600;letter-spacing:.09em;color:var(--accent);text-transform:uppercase;flex-shrink:0;white-space:nowrap;}
  .site-title{font-size:1.2rem;font-weight:700;color:var(--accent-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;min-width:0;}
  .subtitle{font-size:.95rem;color:var(--ink-muted);margin-top:22px;max-width:46ch;}

  .subject-grid{max-width:720px;margin:9px auto 0;display:flex;gap:8px;}
  .subject-tile{
    flex:1 1 0;min-width:0;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:6px 9px;text-decoration:none;color:inherit;transition:border-color .15s ease;
  }
  a.subject-tile:hover{border-color:var(--subject-color, var(--accent));}
  .subject-tile.is-empty{opacity:.5;}
  .subject-icon{
    flex-shrink:0;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:.72rem;background:var(--subject-color, var(--accent));
  }
  .subject-text{display:flex;flex-direction:column;min-width:0;line-height:1.2;}
  .subject-name{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.68rem;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .subject-meta{font-size:.64rem;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .toc{margin-top:36px;display:flex;flex-direction:column;gap:32px;}
  .toc-section-head{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--subject-color, var(--border));padding-bottom:10px;margin-bottom:14px;}
  .toc-section-head .dot{width:10px;height:10px;border-radius:50%;background:var(--subject-color, var(--accent));flex-shrink:0;}
  .toc-section-head h2{font-size:1.15rem;color:var(--ink);flex:1;}
  .toc-section-head .count{font-size:.76rem;color:var(--ink-muted);font-family:"JetBrains Mono",monospace;white-space:nowrap;}
  .chapter-list{display:flex;flex-direction:column;gap:10px;}
  .chapter-row{
    display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:13px 16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .15s ease;
  }
  .chapter-row:hover{border-color:var(--subject-color, var(--accent));transform:translateX(3px);}
  .chapter-row .num{
    flex-shrink:0;width:36px;height:36px;border-radius:9px;background:var(--subject-color, var(--accent-soft));color:#fff;
    font-family:"JetBrains Mono",monospace;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .chapter-row .body{flex:1;min-width:0;}
  .chapter-row .title{font-family:"Spectral",serif;font-weight:600;font-size:1rem;line-height:1.35;}
  .chapter-row .date{display:block;font-size:.74rem;color:var(--ink-muted);font-family:"JetBrains Mono",monospace;margin-top:3px;}
  .chapter-row .chevron{flex-shrink:0;color:var(--ink-muted);}
  .chapter-row:hover .chevron{color:var(--accent);}
  .coming-soon{font-size:.85rem;color:var(--ink-muted);text-align:center;padding:14px;border:1px dashed var(--border);border-radius:12px;}

  footer{margin-top:44px;color:var(--ink-muted);font-size:.78rem;text-align:center;}
</style>
</head>
<body>
<script src="chapters-data.js?v=2"></script>
<div class="pinned-header">
  <div class="pinned-header-inner">
    <span class="eyebrow">Prépa &middot; MPSI</span>
    <h1 class="site-title">Le Cahier de Léane</h1>
  </div>
  <div class="subject-grid" id="subjectGrid"></div>
</div>
<main>
  <p class="subtitle">Cours de maths, physique et sciences de l'ingénieur, repris au propre et vérifiés au fil de l'année.</p>

  <div class="toc" id="toc"></div>

  <footer>Mis à jour au fil des chapitres traités.</footer>
</main>

<script>
(function(){
  "use strict";

  var CHAPTERS = window.SITE_CHAPTERS || [];

  var SUBJECTS = window.SITE_SUBJECTS || [];

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function formatDate(iso){
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("fr-FR", {day:"numeric", month:"short"});
  }

  var CHEVRON_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>';

  function render(){
    var grid = document.getElementById("subjectGrid");
    var toc = document.getElementById("toc");
    grid.innerHTML = "";
    toc.innerHTML = "";

    var groups = [];

    SUBJECTS.forEach(function(subj){
      var chapters = CHAPTERS.filter(function(c){ return c.subject === subj.key; })
        .sort(function(a,b){ return (a.addedAt||"").localeCompare(b.addedAt||""); });

      var hasContent = chapters.length > 0;
      var tile = document.createElement(hasContent ? "a" : "div");
      tile.className = "subject-tile" + (hasContent ? "" : " is-empty");
      tile.style.setProperty("--subject-color", subj.color);
      if (hasContent) tile.href = "#subj-" + subj.slug;
      tile.innerHTML =
        '<span class="subject-icon">' + subj.icon + '</span>' +
        '<span class="subject-text">' +
          '<span class="subject-name">' + escapeHtml(subj.short) + '</span>' +
          '<span class="subject-meta">' + (hasContent ? chapters.length : "—") + '</span>' +
        '</span>';
      grid.appendChild(tile);

      if (hasContent) groups.push({ subj: subj, chapters: chapters });
    });

    groups.forEach(function(group){
      var section = document.createElement("section");
      section.className = "toc-section";
      section.id = "subj-" + group.subj.slug;
      section.style.setProperty("--subject-color", group.subj.color);

      var head = document.createElement("div");
      head.className = "toc-section-head";
      head.innerHTML =
        '<span class="dot"></span>' +
        '<h2>' + escapeHtml(group.subj.key) + '</h2>' +
        '<span class="count">' + group.chapters.length + ' chapitre' + (group.chapters.length === 1 ? "" : "s") + '</span>';
      section.appendChild(head);

      var list = document.createElement("div");
      list.className = "chapter-list";
      group.chapters.forEach(function(c, i){
        var a = document.createElement("a");
        a.className = "chapter-row";
        a.href = c.url;
        a.innerHTML =
          '<span class="num">' + String(i + 1).padStart(2, "0") + '</span>' +
          '<span class="body">' +
            '<span class="title">' + escapeHtml(c.title) + '</span>' +
            '<span class="date">Rédigé le ' + escapeHtml(formatDate(c.addedAt)) + '</span>' +
          '</span>' +
          '<span class="chevron">' + CHEVRON_SVG + '</span>';
        list.appendChild(a);
      });
      section.appendChild(list);
      toc.appendChild(section);
    });
  }

  render();
})();
</script>

</body>
</html>
